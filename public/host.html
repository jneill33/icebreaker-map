<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icebreaker Map: Host</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="host">
    <aside>
      <div class="card">
        <h2>Scan to join</h2>
        <img id="qr" class="qr" alt="QR code to join this session" width="280" height="280">
        <p id="join-url" class="join-url muted"></p>
        <div class="row">
          <button id="copy" class="secondary" type="button">Copy link</button>
          <button id="end" class="danger" type="button" hidden>End session</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </div>
      <div class="card">
        <h2 id="question"></h2>
        <p class="muted"><span id="count">0</span> on the map</p>
        <ul id="people" class="people"></ul>
      </div>
    </aside>
    <div id="map" class="map"></div>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/map.js"></script>
  <script src="/host.js"></script>
</body>
</html>
