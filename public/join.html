<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the map</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <section id="join-view">
      <h1>Say hi 👋</h1>

      <form id="join" class="card">
        <label for="name">Your name</label>
        <input id="name" type="text" maxlength="40" autocomplete="given-name" required>

        <label id="answer-label" for="answer">Your answer</label>
        <input id="answer" type="text" maxlength="140" autocomplete="off">

        <label for="zip">Your ZIP code</label>
        <input id="zip" type="text" inputmode="numeric" pattern="[0-9]{5}(-[0-9]{4})?"
               maxlength="10" autocomplete="postal-code" placeholder="e.g. 78701" required>

        <p class="consent">
          We use your ZIP only to place a pin on the map. It isn't saved, and the pin is
          rounded to about 10&nbsp;km (city level). Everything is deleted when the host
          ends the session, or after 12 hours.
        </p>

        <button class="block" type="submit">Put me on the map</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </section>

    <section id="done-view" hidden>
      <h1>You're on the map 🎉</h1>
      <p class="muted"><span id="count">0</span> here so far. Tap a pin to see who it is.</p>
      <div id="map" class="map map-small"></div>
      <p><button id="leave" class="secondary" type="button">Remove me from the map</button></p>
      <p id="done-status" class="status" role="status"></p>
    </section>
  </main>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/map.js"></script>
  <script src="/join.js"></script>
</body>
</html>
